[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-engine"
version = "0.1.0"
description = "BhuNaksha + satellite superimposition pipeline — Parameter 5 (Geo-Coordinates) of Sitaara's property verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rapidfuzz>=3.0",
    "indic-transliteration>=2.3",
    "requests>=2.28",
    "pillow>=10.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gps-engine = "gps_engine.cli:main"

[tool.setuptools]
packages = ["gps_engine", "gps_engine.adapters"]

[tool.pytest.ini_options]
testpaths = ["gps_engine/tests"]
